openapi: 3.0.3
info:
  title: Personal AI CFO API
  version: 0.1.0
  description: >
    Source of truth for routes, DTOs, and enums. See .agents/api-contract.md for the
    human-readable explanation of conventions (money as paise, auth via Cognito sub, error
    shape, etc). Keep this file and that doc in sync in the same PR.

servers:
  - url: https://{apiId}.execute-api.ap-south-1.amazonaws.com
    variables:
      apiId:
        default: TBD

components:
  securitySchemes:
    CognitoJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, UNAUTHORIZED, NOT_FOUND, UPSTREAM_UNAVAILABLE,
                     INSUFFICIENT_DATA, INTERNAL, NOT_IMPLEMENTED, CONFLICT]
            message:
              type: string
            details:
              type: object

    AssetType:
      type: string
      enum: [STOCK, ETF, MUTUAL_FUND, FD, CASH, CRYPTO, OTHER]
    HoldingSource:
      type: string
      enum: [UPSTOX, MANUAL, DEMO, IMPORTED]
    RiskProfile:
      type: string
      enum: [CONSERVATIVE, MODERATE, AGGRESSIVE]
    StrategyGoal:
      type: string
      enum: [WEALTH_GROWTH, INCOME, CAPITAL_PRESERVATION, FIRE]
    GoalType:
      type: string
      enum: [CAR, WEDDING, HOUSE_DOWN_PAYMENT, EDUCATION, TRAVEL, OTHER]
    LoanType:
      type: string
      enum: [HOME, CAR, PERSONAL, EDUCATION, CREDIT_CARD, OTHER]
    RateType:
      type: string
      enum: [FLOATING, FIXED]
    Direction:
      type: string
      enum: [CREDIT, DEBIT]
    TxnCategory:
      type: string
      enum: [INCOME, RENT, GROCERIES, FOOD_DELIVERY, DINING, TRANSPORT, SHOPPING, UTILITIES,
             SUBSCRIPTIONS, EMI, INVESTMENTS, TRANSFER, HEALTH, EDUCATION, ENTERTAINMENT, OTHER]
    StatementStatus:
      type: string
      enum: [PENDING_UPLOAD, UPLOADED, EXTRACTING, VALIDATING, REVIEW_REQUIRED, COMMITTED, FAILED]
    ChatJobStatus:
      type: string
      enum: [QUEUED, RUNNING, COMPLETED, FAILED]
    FlagSeverity:
      type: string
      enum: [info, warning, critical]

    UserProfile:
      type: object
      properties:
        user_id: {type: string, description: "Cognito sub"}
        name: {type: string}
        date_of_birth: {type: string, format: date}
        base_currency: {type: string, default: INR}
        monthly_income_paise: {type: integer, nullable: true}
        monthly_expenses_paise: {type: integer, description: "excludes EMIs"}
        monthly_investment_paise: {type: integer}
        declared_net_worth_paise: {type: integer, nullable: true}
        cash_balance_paise: {type: integer}
        emergency_fund_target_months: {type: integer, default: 6}
        risk_profile: {$ref: '#/components/schemas/RiskProfile'}
        risk_score: {type: integer}
        risk_answers:
          type: array
          nullable: true
          minItems: 4
          maxItems: 4
          items: {type: integer, minimum: 1, maximum: 3}
        consent_accepted_at: {type: string, format: date-time, nullable: true}
        investment_horizon_years: {type: integer}
        strategy_goal: {$ref: '#/components/schemas/StrategyGoal'}
        dependents_count: {type: integer, nullable: true}
        existing_term_cover_paise: {type: integer, nullable: true}
        existing_health_cover_paise: {type: integer, nullable: true}
        employment_type: {type: string, nullable: true}
        city_tier: {type: string, nullable: true}
        onboarding_step: {type: integer}
        onboarded: {type: boolean}

    Holding:
      type: object
      properties:
        holding_id: {type: string}
        asset_type: {$ref: '#/components/schemas/AssetType'}
        source: {$ref: '#/components/schemas/HoldingSource'}
        instrument_key: {type: string, nullable: true}
        symbol: {type: string, nullable: true}
        isin: {type: string, nullable: true}
        name: {type: string}
        quantity: {type: number, nullable: true}
        avg_buy_price_paise: {type: integer, nullable: true}
        first_buy_date: {type: string, format: date, nullable: true}
        manual_current_value_paise: {type: integer, nullable: true}
        sector: {type: string, nullable: true}
        sip_monthly_paise: {type: integer, nullable: true}
        fd_type: {type: string, enum: [CUMULATIVE, PAYOUT], nullable: true}
        fd_principal_paise: {type: integer, nullable: true}
        fd_annual_rate: {type: number, nullable: true}
        fd_start_date: {type: string, format: date, nullable: true}
        fd_maturity_date: {type: string, format: date, nullable: true}

    Goal:
      type: object
      properties:
        goal_id: {type: string}
        name: {type: string}
        goal_type: {$ref: '#/components/schemas/GoalType'}
        amount_today_paise: {type: integer}
        current_saved_paise: {type: integer, minimum: 0, maximum: 10000000000}
        target_age: {type: integer}
        target_date: {type: string, format: date}
        inflation_rate: {type: number, description: "default 0.10 for EDUCATION, else 0.06"}
        priority: {type: integer, nullable: true}

    Loan:
      type: object
      properties:
        loan_id: {type: string}
        name: {type: string}
        loan_type: {$ref: '#/components/schemas/LoanType'}
        principal_paise: {type: integer}
        outstanding_paise: {type: integer}
        annual_rate: {type: number}
        tenure_months: {type: integer}
        start_date: {type: string, format: date}
        rate_type: {$ref: '#/components/schemas/RateType'}
        prepayment_charge_pct: {type: number, default: 0}

    PortfolioAnalysis:
      type: object
      properties:
        as_of: {type: string, format: date-time}
        price_source: {type: string}
        total_value_paise: {type: integer}
        total_cost_paise: {type: integer}
        unrealized_pnl_paise: {type: integer}
        unrealized_pnl_pct: {type: number}
        holdings:
          type: array
          items:
            type: object
            properties:
              holding_id: {type: string}
              symbol: {type: string}
              asset_type: {$ref: '#/components/schemas/AssetType'}
              quantity: {type: number}
              price_paise: {type: integer}
              value_paise: {type: integer}
              weight_pct: {type: number}
              pnl_paise: {type: integer}
              price_as_of: {type: string, format: date-time}
        allocation_by_asset_type:
          type: array
          items: {type: object, properties: {key: {type: string}, value_paise: {type: integer}, weight_pct: {type: number}}}
        allocation_by_sector:
          type: array
          items: {type: object, properties: {key: {type: string}, value_paise: {type: integer}, weight_pct: {type: number}}}
        risk:
          type: object
          properties:
            annualized_volatility_pct: {type: number}
            volatility_basis: {type: string}
            max_drawdown_pct: {type: number}
            cagr_pct: {type: number, nullable: true}
            lookback: {type: string}
        flags:
          type: array
          items:
            type: object
            properties:
              code: {type: string}
              symbol: {type: string}
              weight_pct: {type: number}
              threshold_pct: {type: number}
              severity: {$ref: '#/components/schemas/FlagSeverity'}
        warnings: {type: array, items: {type: string}}

    FireResult:
      type: object
      properties:
        fire_age: {type: integer, nullable: true}
        required_corpus_at_fire_paise: {type: integer}
        projected_corpus_at_fire_paise: {type: integer}
        implied_withdrawal_rate_pct: {type: number}
        conservative_fire_age: {type: integer, nullable: true}
        progress_pct_today: {type: number}
        assumptions:
          type: object
          properties:
            inflation: {type: number}
            step_up: {type: number}
            return_before_40: {type: number}
            return_40_to_60: {type: number}
            return_after_60: {type: number}
            post_fire_return: {type: number, nullable: true}
            lifespan_age: {type: integer}
        required_curve: {type: array, items: {type: object}}
        projected_curve: {type: array, items: {type: object}}
        warnings: {type: array, items: {type: string}}

    FireCalculateRequest:
      type: object
      description: >
        All fields optional. Omitted profile fields fall back to the stored
        users row; omitted assumptions fall back to defaults (inflation 0.06,
        step_up 0.06, returns 0.12/0.10/0.08, lifespan 91). A client-sent
        user_id is ignored — identity always comes from the JWT sub.
      properties:
        current_age: {type: integer, description: "overrides age from date_of_birth"}
        monthly_expenses_paise: {type: integer}
        monthly_investment_paise: {type: integer}
        current_corpus_paise: {type: integer, description: "overrides holdings-derived corpus (excl. cash, incl. FD)"}
        inflation: {type: number, default: 0.06}
        step_up: {type: number, default: 0.06}
        return_before_40: {type: number, default: 0.12}
        return_40_to_60: {type: number, default: 0.10}
        return_after_60: {type: number, default: 0.08}
        post_fire_return: {type: number, nullable: true}
        lifespan_age: {type: integer, default: 91}
      example:
        monthly_expenses_paise: 5000000
        monthly_investment_paise: 5000000

    GoalImpactRequest:
      type: object
      required: [candidate_goal]
      properties:
        candidate_goal:
          type: object
          required: [amount_today_paise, target_age]
          properties:
            goal_type: {$ref: '#/components/schemas/GoalType'}
            amount_today_paise: {type: integer}
            target_age: {type: integer}
            inflation_rate: {type: number, nullable: true}
        current_age: {type: integer}
        monthly_expenses_paise: {type: integer}
        monthly_investment_paise: {type: integer}
        current_corpus_paise: {type: integer}
        inflation: {type: number}
        step_up: {type: number}
        return_before_40: {type: number}
        return_40_to_60: {type: number}
        return_after_60: {type: number}
        post_fire_return: {type: number, nullable: true}
        lifespan_age: {type: integer}
      example:
        candidate_goal: {goal_type: CAR, amount_today_paise: 50000000, target_age: 35}

    GoalImpactResult:
      type: object
      properties:
        baseline_fire_age: {type: integer, nullable: true}
        with_goal_fire_age: {type: integer, nullable: true}
        delta_years: {type: integer, nullable: true, description: "never negative for a positive-amount goal"}
        baseline_required_corpus_paise: {type: integer, nullable: true}
        with_goal_required_corpus_paise: {type: integer, nullable: true}

    NetWorth:
      type: object
      properties:
        as_of: {type: string, format: date-time}
        total_assets_paise: {type: integer}
        total_liabilities_paise: {type: integer}
        net_worth_paise: {type: integer}
        source: {type: string, enum: [holdings, declared], description: "holdings wins once any holdings exist"}
        cash_balance_paise: {type: integer}
        emergency_fund_coverage_months: {type: number, nullable: true}
        warnings: {type: array, items: {type: string}}

    NetWorthProjection:
      type: object
      properties:
        as_of: {type: string, format: date-time}
        fire_age: {type: integer, nullable: true}
        assumptions: {type: object, description: "same age-stage assumptions as FireResult"}
        curve: {type: array, items: {type: object, properties: {age: {type: integer}, corpus_paise: {type: integer}}}}
        warnings: {type: array, items: {type: string}}

    RupeeDecimal:
      type: string
      pattern: '^(?:[0-9]+(?:\.[0-9]{1,2})?)?$'
      description: Non-negative rupee amount as a decimal string; an empty string means optional/absent at the UI compatibility boundary.

    FinancialMoneyObject:
      type: object
      description: Object whose numeric leaf values are rupee decimal strings at the UI compatibility boundary.
      additionalProperties:
        oneOf:
          - {$ref: '#/components/schemas/RupeeDecimal'}
          - {$ref: '#/components/schemas/FinancialMoneyObject'}

    DashboardManualFinancials:
      type: object
      required: [onboardingMethod, incomes, liquidAssets, portfolio, preferences, liabilities, monthlyExpenses]
      properties:
        onboardingMethod: {type: string, enum: [manual_advanced]}
        incomes: {$ref: '#/components/schemas/FinancialMoneyObject'}
        liquidAssets: {$ref: '#/components/schemas/FinancialMoneyObject'}
        portfolio:
          type: array
          items:
            type: object
            required: [type, ticker, buyPrice, quantity]
            properties:
              type: {type: string}
              ticker: {type: string}
              buyPrice: {$ref: '#/components/schemas/RupeeDecimal'}
              quantity: {type: string, pattern: '^[0-9]+(?:\.[0-9]+)?$'}
        preferences:
          type: object
          required: [industries, instruments]
          properties:
            industries: {type: array, items: {type: string}}
            instruments: {type: array, items: {type: string}}
        liabilities: {$ref: '#/components/schemas/FinancialMoneyObject'}
        monthlyExpenses: {$ref: '#/components/schemas/FinancialMoneyObject'}

    DashboardCsvFinancials:
      type: object
      required: [onboardingMethod, extractedData]
      properties:
        onboardingMethod: {type: string, enum: [csv_extraction]}
        extractedData:
          type: object
          required: [fileName, totalTransactions, currentBalance, monthlyRevenue, monthlyExpenses]
          properties:
            fileName: {type: string}
            totalTransactions: {type: integer, minimum: 0}
            currentBalance: {$ref: '#/components/schemas/RupeeDecimal'}
            monthlyRevenue: {$ref: '#/components/schemas/RupeeDecimal'}
            monthlyExpenses: {$ref: '#/components/schemas/RupeeDecimal'}

    DashboardFinancials:
      oneOf:
        - {$ref: '#/components/schemas/DashboardManualFinancials'}
        - {$ref: '#/components/schemas/DashboardCsvFinancials'}
      description: Manual dashboard snapshot or the CSV extraction snapshot consumed by Aviral's UI.

    DashboardFinancialsRequest:
      type: object
      required: [financials]
      properties:
        financials: {$ref: '#/components/schemas/DashboardFinancials'}

    DashboardProfileResponse:
      type: object
      required: [user]
      properties:
        user:
          type: object
          required: [hasOnboarded, financials]
          properties:
            hasOnboarded: {type: boolean}
            financials: {$ref: '#/components/schemas/DashboardFinancials'}

    PricesResponse:
      type: object
      required: [prices, source, as_of]
      properties:
        prices:
          type: object
          additionalProperties: {type: number}
        quotes:
          type: object
          description: Additive quote details when the upstream returns them; legacy consumers may continue using prices.
          additionalProperties:
            type: object
            required: [price]
            properties:
              price: {type: number}
              changePercent: {type: number}
              currency: {type: string, description: "Always INR for securities; index levels, futures and FX pairs keep Yahoo's native currency."}
              originalPrice: {type: number, description: "Source price when a non-INR quote was converted to rupees."}
              originalCurrency: {type: string, description: "Source currency when a non-INR quote was converted to rupees."}
        source: {type: string, enum: [Yahoo Finance]}
        as_of: {type: string, format: date-time}

    NewsResponse:
      type: object
      required: [news, source, as_of]
      properties:
        news:
          type: array
          items:
            type: object
            required: [id, ticker, title, publisher, link, publishedAt, summary]
            properties:
              id: {type: string}
              ticker: {type: string}
              title: {type: string}
              publisher: {type: string}
              link: {type: string, format: uri}
              publishedAt: {type: string, format: date-time}
              summary: {type: string}
              thumbnail: {type: string, format: uri, nullable: true}
        source:
          type: string
          description: "The providers that actually contributed items, e.g. 'Yahoo Finance', 'Google News' or 'Yahoo Finance, Google News'."
          example: Yahoo Finance, Google News
        as_of: {type: string, format: date-time}

    HistoricalResponse:
      type: object
      required: [range, data, availableLines, source, as_of]
      properties:
        range: {type: string, enum: [1W, 1M, 3M, 6M, 1Y, ALL]}
        data:
          type: array
          description: Data points with normalized percentage returns; object fields are supplied by the selected lines.
          items: {type: object}
        availableLines: {type: array, items: {type: string}}
        source: {type: string, enum: [Yahoo Finance]}
        as_of: {type: string, format: date-time}

    SuggestionsResponse:
      type: object
      required: [suggestions, activePreferences]
      properties:
        suggestions:
          type: array
          items:
            type: object
            required: [ticker, name, industry, instrument, price, change, rationale]
            properties:
              ticker: {type: string}
              name: {type: string}
              industry: {type: string}
              instrument: {type: string}
              price: {type: number}
              change: {type: string, pattern: '^[+-]?[0-9]+(?:\.[0-9]+)?%$'}
              rationale: {type: string}
        activePreferences:
          type: object
          required: [industries, instruments]
          properties:
            industries: {type: array, items: {type: string}}
            instruments: {type: array, items: {type: string}}

    StatementCreateRequest:
      type: object
      additionalProperties: false
      required: [file_name, input_type, content_type]
      properties:
        job_id: {type: string, format: uuid}
        file_name: {type: string, minLength: 1, maxLength: 255, pattern: '^[^/\\\\]+\\.csv$'}
        input_type: {type: string, enum: [csv]}
        content_type: {type: string, enum: [text/csv]}
      description: Client identity fields are not accepted; identity is the verified Cognito sub.

    StatementUpload:
      type: object
      required: [url, key, expires_in]
      properties:
        url: {type: string, format: uri}
        key: {type: string}
        expires_in: {type: integer, enum: [900]}

    StatementCreateResponse:
      type: object
      required: [job_id, status, file_name, upload]
      properties:
        job_id: {type: string, format: uuid}
        status: {type: string, enum: [PENDING_UPLOAD]}
        file_name: {type: string}
        upload: {$ref: '#/components/schemas/StatementUpload'}

    TransactionRow:
      type: object
      additionalProperties: false
      required: [txn_id, txn_date, description, amount_paise, direction, category, category_source]
      properties:
        txn_id: {type: string, maxLength: 120}
        txn_date: {type: string, format: date}
        description: {type: string, minLength: 1, maxLength: 500}
        amount_paise: {type: integer, minimum: 1}
        direction: {$ref: '#/components/schemas/Direction'}
        category: {$ref: '#/components/schemas/TxnCategory'}
        category_source: {type: string, enum: [rule, user]}
        balance_paise: {type: integer, nullable: true}

    StatementValidationSummary:
      type: object
      required: [row_count, credit_total_paise, debit_total_paise, net_paise, reconciled, balance_delta_paise]
      properties:
        row_count: {type: integer, minimum: 0, maximum: 1000}
        credit_total_paise: {type: integer, minimum: 0}
        debit_total_paise: {type: integer, minimum: 0}
        net_paise: {type: integer}
        reconciled: {type: boolean}
        balance_delta_paise: {type: integer, minimum: 0, maximum: 1}

    StatementReconciliationSummary:
      type: object
      required: [reconciled, balance_delta_paise]
      properties:
        reconciled: {type: boolean}
        balance_delta_paise: {type: integer, minimum: 0, maximum: 1}

    StatementResponse:
      type: object
      required: [job_id, status, validation_summary, reconciliation_summary, review_rows]
      properties:
        job_id: {type: string, format: uuid}
        file_name: {type: string}
        status: { $ref: '#/components/schemas/StatementStatus' }
        validation_summary: {$ref: '#/components/schemas/StatementValidationSummary'}
        reconciliation_summary: {$ref: '#/components/schemas/StatementReconciliationSummary'}
        review_rows:
          type: array
          maxItems: 1000
          items: {$ref: '#/components/schemas/TransactionRow'}

    StatementCommitRequest:
      type: object
      additionalProperties: false
      properties:
        reviewed_rows:
          type: array
          minItems: 1
          maxItems: 1000
          items: {$ref: '#/components/schemas/TransactionRow'}
        confirm_stored_rows: {type: boolean, enum: [true]}
      description: Send reviewed_rows or explicitly confirm_stored_rows=true. Required only while status is REVIEW_REQUIRED.

    StatementCommitResponse:
      type: object
      required: [job_id, status, summary, committed_row_count]
      properties:
        job_id: {type: string, format: uuid}
        status: {type: string, enum: [COMMITTED]}
        summary:
          type: object
          required: [months, totals]
          properties:
            months: {type: array, items: {$ref: '#/components/schemas/CashflowMonth'}}
            totals: {$ref: '#/components/schemas/CashflowTotals'}
        committed_row_count: {type: integer, minimum: 0, maximum: 1000}

    CashflowMonth:
      type: object
      required: [month, income_paise, expense_paise, net_paise]
      properties:
        month: {type: string, pattern: '^\\d{4}-\\d{2}$'}
        income_paise: {type: integer, minimum: 0}
        expense_paise: {type: integer, minimum: 0}
        net_paise: {type: integer}

    CashflowTotals:
      type: object
      required: [income_paise, expense_paise, net_paise]
      properties:
        income_paise: {type: integer, minimum: 0}
        expense_paise: {type: integer, minimum: 0}
        net_paise: {type: integer}

    CashflowSummary:
      type: object
      required: [months, totals, current_balance_paise]
      properties:
        months: {type: array, items: {$ref: '#/components/schemas/CashflowMonth'}}
        totals: {$ref: '#/components/schemas/CashflowTotals'}
        current_balance_paise: {type: integer, nullable: true}

  parameters:
    InstrumentKey:
      name: instrument_key
      in: query
      required: true
      schema: {type: string}
      example: "NSE_EQ|INE040A01034"
    Tickers:
      name: tickers
      in: query
      required: false
      style: form
      explode: false
      description: Optional comma-separated, sanitized Yahoo ticker symbols; no more than 20 symbols are accepted when present. Endpoint-specific server-side scoping still applies.
      schema:
        type: array
        minItems: 1
        maxItems: 20
        items:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[A-Za-z0-9][A-Za-z0-9._^=-]{0,19}$'

security:
  - CognitoJwt: []

paths:
  # ---- Node Lambda (CRUD) ----
  /me:
    get:
      summary: Get current user's profile
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/UserProfile'}}}}
        '404': {description: Not onboarded, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /me/profile:
    put:
      summary: Update profile (used by onboarding steps)
      requestBody:
        content: {application/json: {schema: {$ref: '#/components/schemas/UserProfile'}}}
      responses:
        '200': {description: OK}

  # ---- Node Lambda (dashboard and market compatibility routes) ----
  /dashboard/profile:
    get:
      summary: Get the authenticated user's dashboard profile snapshot
      description: Identity comes only from the Cognito JWT sub; no email or user_id query input is accepted. Returns 200 with default financials when the profile or snapshot is missing.
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DashboardProfileResponse'}}}}
        '500': {description: Internal error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /dashboard/financials:
    put:
      summary: Update the authenticated user's dashboard financial snapshot
      description: UI money values are rupee decimal strings here; canonical storage and math remain integer paise. Identity comes from the Cognito JWT sub.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DashboardFinancialsRequest'}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DashboardProfileResponse'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {description: Internal error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

  /portfolio/prices:
    get:
      summary: Get current prices for up to 20 sanitized tickers
      description: Yahoo failures may yield partial results. Current prices are never fabricated; failures use UPSTREAM_UNAVAILABLE.
      parameters: [{$ref: '#/components/parameters/Tickers'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/PricesResponse'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '502': {description: Upstream unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /portfolio/news:
    get:
      summary: Get news for up to 20 sanitized tickers
      description: News is limited to the authenticated user's held tickers plus deterministic candidates matching saved investment interests. Yahoo failures may yield partial results. News is never fabricated; total upstream failure uses UPSTREAM_UNAVAILABLE.
      parameters: [{$ref: '#/components/parameters/Tickers'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/NewsResponse'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '502': {description: Upstream unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /portfolio/historical:
    get:
      summary: Get normalized percentage-return history for up to 20 sanitized tickers
      description: Requested symbols are intersected with the authenticated user's held portfolio, with at most 18 holdings plus NIFTY 50 and S&P 500 benchmarks. Historical data is never fabricated; Yahoo failures may yield partial results and use UPSTREAM_UNAVAILABLE when no result is available.
      parameters:
        - {$ref: '#/components/parameters/Tickers'}
        - name: range
          in: query
          required: false
          schema: {type: string, enum: [1W, 1M, 3M, 6M, 1Y, ALL], default: 1Y}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/HistoricalResponse'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '502': {description: Upstream unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /portfolio/suggestions:
    get:
      summary: Get deterministic educational portfolio-fit ideas
      description: Suggestions derive preferences, risk, and holdings server-side. No preference or user identity query inputs are accepted; suggestions are not buy/sell advice.
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/SuggestionsResponse'}}}}

  /holdings:
    get:
      summary: List holdings
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Holding'}}}}}
    post:
      summary: Add a holding
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Holding'}}}}
      responses: {'201': {description: Created}}
  /holdings/{holding_id}:
    put:
      summary: Update a holding
      parameters: [{name: holding_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: OK}}
    delete:
      summary: Delete a holding
      parameters: [{name: holding_id, in: path, required: true, schema: {type: string}}]
      responses: {'204': {description: Deleted}}

  /goals:
    get:
      summary: List goals
      responses: {'200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Goal'}}}}}}
    post:
      summary: Add a goal
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Goal'}}}}
      responses: {'201': {description: Created}}
  /goals/{goal_id}:
    put: {summary: Update a goal, parameters: [{name: goal_id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: OK}}}
    delete: {summary: Delete a goal, parameters: [{name: goal_id, in: path, required: true, schema: {type: string}}], responses: {'204': {description: Deleted}}}

  /loans:
    get:
      summary: List loans
      responses: {'200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Loan'}}}}}}
    post:
      summary: Add a loan
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Loan'}}}}
      responses: {'201': {description: Created}}
  /loans/{loan_id}:
    put: {summary: Update a loan, parameters: [{name: loan_id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: OK}}}
    delete: {summary: Delete a loan, parameters: [{name: loan_id, in: path, required: true, schema: {type: string}}], responses: {'204': {description: Deleted}}}

  # ---- Python Lambda (finance) ----
  /portfolio/analysis:
    get:
      summary: Full portfolio analysis — value, weights, concentration flags, risk metrics
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/PortfolioAnalysis'}}}}}

  /securities/search:
    get:
      summary: Search the local instrument index
      parameters: [{name: q, in: query, required: true, schema: {type: string}}]
      responses: {'200': {description: OK}}
  /securities/detail:
    get:
      summary: Security overview (quote + profile + key ratios)
      parameters: [{$ref: '#/components/parameters/InstrumentKey'}]
      responses: {'200': {description: OK}}
  /securities/history:
    get:
      summary: Historical candles
      parameters:
        - {$ref: '#/components/parameters/InstrumentKey'}
        - {name: period, in: query, schema: {type: string, enum: [1d, 3d, 1m, 6m, 1y, 3y, 5y]}}
      responses: {'200': {description: OK}}
  /securities/fit:
    get:
      summary: Portfolio-fit impact of adding to a security
      parameters:
        - {$ref: '#/components/parameters/InstrumentKey'}
        - {name: add_amount_paise, in: query, schema: {type: integer}}
      responses: {'200': {description: OK}}
  /securities/short-term-fit:
    get:
      summary: Rolling-window short-term return analysis (Level 3, calculators-seed)
      parameters:
        - {$ref: '#/components/parameters/InstrumentKey'}
        - {name: horizon_months, in: query, schema: {type: integer}}
      responses: {'200': {description: OK}}

  /fire/calculate:
    post:
      summary: Compute FIRE age (see .agents/finance-rules.md for the locked fixture)
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: '#/components/schemas/FireCalculateRequest'}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/FireResult'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: No user profile, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /fire/goal-impact:
    post:
      summary: Compare baseline FIRE vs FIRE with one added goal
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/GoalImpactRequest'}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/GoalImpactResult'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: No user profile, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /fire/scenarios:
    get: {summary: List saved scenarios, responses: {'200': {description: OK}}}
    post: {summary: Save a scenario, responses: {'201': {description: Created}}}

  /net-worth:
    get:
      summary: Current net worth
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/NetWorth'}}}}
        '404': {description: No user profile, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /net-worth/projection:
    get:
      summary: Net worth projection (shares FIRE assumptions)
      parameters: [{name: years, in: query, schema: {type: integer, default: 30, minimum: 1, maximum: 80}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/NetWorthProjection'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: No user profile, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

  /loans/emi:
    post: {summary: EMI calculator, responses: {'200': {description: OK}}}
  /loans/prepayment-impact:
    post: {summary: Prepayment impact (reduce_tenure default), responses: {'200': {description: OK}}}

  /calculators/tax:
    post: {summary: Income tax estimate, both regimes, responses: {'200': {description: OK}}}
  /calculators/capital-gains:
    post: {summary: Capital gains estimate, responses: {'200': {description: OK}}}
  /calculators/insurance:
    post: {summary: Term/health cover estimate, responses: {'200': {description: OK}}}
  /calculators/credit-card-payoff:
    post: {summary: Card payoff calculator, responses: {'200': {description: OK}}}

  /statements:
    post:
      summary: Create a bounded CSV statement job and presigned S3 PUT URL
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/StatementCreateRequest'}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/StatementCreateResponse'}}}}
        '400': {description: Unsupported input or client identity field, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /statements/{job_id}/process:
    post:
      summary: Parse, validate, categorize, and persist a review artifact; never commits transactions
      parameters: [{name: job_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '202': {description: Review required, content: {application/json: {schema: {$ref: '#/components/schemas/StatementResponse'}}}}
        '400': {description: CSV validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: Job is not owned by the authenticated user, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: Job is already committed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '502': {description: Uploaded object unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /statements/{job_id}:
    get:
      summary: Get job status + extracted rows for review
      parameters: [{name: job_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/StatementResponse'}}}}
        '404': {description: Job is not owned by the authenticated user, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /statements/{job_id}/commit:
    post:
      summary: Explicitly commit reviewed rows to the authenticated user's transactions
      parameters: [{name: job_id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/StatementCommitRequest'}}}
      responses:
        '200': {description: Committed or already committed, content: {application/json: {schema: {$ref: '#/components/schemas/StatementCommitResponse'}}}}
        '400': {description: Review rows invalid or explicit confirmation missing, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: Job is not owned by the authenticated user, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: Job is not REVIEW_REQUIRED, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /cashflow/summary:
    get:
      summary: Query authenticated transactions and return deterministic monthly paise totals
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/CashflowSummary'}}}}

